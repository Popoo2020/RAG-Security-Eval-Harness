<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<rect width="1200" height="420" fill="#ffffff"/>
<style>
.box{fill:#f8fafc;stroke:#111827;stroke-width:2;rx:18}
.good{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:18}
.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:18}
.bad{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:18}
.t{font:700 26px Arial;fill:#111827}.l{font:700 18px Arial;fill:#111827}.s{font:15px Arial;fill:#374151}
.arrow{stroke:#374151;stroke-width:3;fill:none}
</style>
<text x="600" y="42" text-anchor="middle" class="t">RAG Security Evaluation Harness</text>
<rect x="60" y="135" width="220" height="100" class="box"/><text x="170" y="173" text-anchor="middle" class="l">Retrieved content</text><text x="170" y="200" text-anchor="middle" class="s">trusted / mixed / untrusted</text>
<rect x="340" y="135" width="220" height="100" class="box"/><text x="450" y="173" text-anchor="middle" class="l">Signal evaluator</text><text x="450" y="200" text-anchor="middle" class="s">override + exfiltration</text>
<rect x="620" y="135" width="220" height="100" class="box"/><text x="730" y="173" text-anchor="middle" class="l">Risk score</text><text x="730" y="200" text-anchor="middle" class="s">LOW / MEDIUM / HIGH</text>
<rect x="900" y="95" width="220" height="70" class="good"/><text x="1010" y="137" text-anchor="middle" class="l">LOW</text>
<rect x="900" y="185" width="220" height="70" class="warn"/><text x="1010" y="227" text-anchor="middle" class="l">MEDIUM</text>
<rect x="900" y="275" width="220" height="70" class="bad"/><text x="1010" y="317" text-anchor="middle" class="l">HIGH</text>
<line x1="280" y1="185" x2="340" y2="185" class="arrow"/>
<line x1="560" y1="185" x2="620" y2="185" class="arrow"/>
<line x1="840" y1="170" x2="900" y2="130" class="arrow"/>
<line x1="840" y1="185" x2="900" y2="220" class="arrow"/>
<line x1="840" y1="200" x2="900" y2="310" class="arrow"/>
</svg>
